<body>
<div id="shell">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="touch" aria-hidden="true">
        <div class="pad">
            <button class="tbtn" data-key="ArrowLeft">&#9664;</button>
            <button class="tbtn" data-key="ArrowRight">&#9654;</button>
        </div>
        <div class="pad right">
            <button class="tbtn wide" data-key="Space">&#9651;</button>
            <button class="tbtn wide" data-key="KeyE">OK</button>
        </div>
    </div>

    <div id="rotate">Fordítsd el a telefont fekvőbe &#128260;</div>
</div>

<script src="js/art.js"></script>
<script src="js/story.js"></script>
